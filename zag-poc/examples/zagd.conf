# Zag Script and zagd project policy template.
#
# Copy this file to the root of a project as .zagd.conf.  Every source command
# will then keep one bounded project-local zagd process running in adaptive mode.
# Change mode=off for a persistent opt-out; a one-shot foreground command can
# use --no-zagd without changing this file.

# Background planning is editor-independent.  script_optimization=automatic
# authorizes consumption only for a winner that the foreground verifier can
# revalidate; it does not imply that the current release has such a winner.
# Regular Zag remains review-only.  The generated capability matrix is the
# authority on implemented optimizer behavior.  Idle work never rewrites source.
mode=adaptive
idle_deep=true
difficulty=simple
script_optimization=automatic
regular_optimization=review
objective=runtime
trust_mode=stable
notifications=advisory
max_workers=1
stability_window_ms=75
max_memory_bytes=536870912
max_cache_bytes=2147483648

# Defaults apply only to unspecified Zag Script choices.  Explicit command-line
# choices win, and ordinary Zag remains advisory-only.
allocator=script_process_arena
script_memory_bytes=67108864
cpu=generic
device=cpu
layout=compiler_owned

# Script root capability policy.  Keep environment_allow empty unless a Script
# actually needs a named process-environment variable.
allow_filesystem_read=true
allow_filesystem_write=true
allow_process=true
environment_allow=

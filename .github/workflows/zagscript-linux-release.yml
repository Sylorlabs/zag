name: ZagScript Linux x86-64 release qualification

# Run the full first-release gate on native x86-64 Linux, where a fresh
# self-hosted rebuild is not slowed by Apple Silicon's QEMU TCG emulation.
# Master certification additionally requires guarded memory and 30-run
# benchmark evidence and is intentionally separate.
on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/zagscript-linux-native-ci-*'
    paths:
      - '.github/workflows/zagscript-linux-release.yml'
      - 'zag-poc/**'

permissions:
  contents: read

jobs:
  first-release:
    name: First-release gate (native Linux x86-64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        working-directory: zag-poc
        shell: bash
    env:
      # The suite's default 900 seconds can time out on busy hosted workers.
      # A timeout still fails certification; it is never counted as a pass.
      ZAG_SELFHOST_TIMEOUT_SECONDS: '1800'
      ZAG_BOOTSTRAP_STAGE_TIMEOUT_SECONDS: '3600'
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Verify compiler host and record source identity
        run: |
          set -euo pipefail
          test "$(uname -s):$(uname -m)" = Linux:x86_64
          if grep -q 'QEMU TCG' /proc/cpuinfo; then
            echo 'QEMU TCG emulation cannot provide native x86 qualification' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/zagscript-linux-evidence"
          {
            printf 'source=%s\n' "$GITHUB_SHA"
            uname -a
            grep -m1 'model name' /proc/cpuinfo
            file znc zagd
            sha256sum znc zagd
          } | tee "$RUNNER_TEMP/zagscript-linux-evidence/host.txt"
          test -x znc
          test -x zagd
          file -b znc | grep -Eq '^ELF 64-bit.*x86-64.*statically linked'

      - name: Install native test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace libssl-dev libsqlite3-dev sqlite3

      - name: Build compiler and daemon to a verified fixed point
        env:
          # CI runners do not provide a suitable user systemd cgroup.
          # The separate master gate remains fail-closed without it.
          ZAG_BOOTSTRAP_MEMORY_GUARD: 'off'
        run: |
          set -euo pipefail
          seed="$PWD/znc"
          seed_sha=$(sha256sum "$seed" | cut -d' ' -f1)
          manifest="$RUNNER_TEMP/zag-ci-bootstrap.mod"
          printf 'name = "zag-linux-release"\nedition = "2026"\n[toolchain]\ncompiler = "sha256:%s"\n' "$seed_sha" > "$manifest"
          ZAG_BOOTSTRAP_SEED="$seed" ZAG_BOOTSTRAP_MANIFEST="$manifest" \
            bash bootstrap.sh 2>&1 | tee "$RUNNER_TEMP/zagscript-linux-evidence/bootstrap.log"
          file znc zagd | tee "$RUNNER_TEMP/zagscript-linux-evidence/bootstrap-artifacts.txt"
          sha256sum znc zagd >> "$RUNNER_TEMP/zagscript-linux-evidence/bootstrap-artifacts.txt"

      - name: Complete authoritative ZagScript first-release gate
        run: |
          set -euo pipefail
          bash tests/run_zagscript_release_gate.sh 2>&1 | \
            tee "$RUNNER_TEMP/zagscript-linux-evidence/first-release-gate.log"

      - name: Attach evidence and explicit certification scope
        if: always()
        run: |
          {
            echo '### ZagScript Linux x86-64 qualification'
            echo
            echo "Source: \`$GITHUB_SHA\`"
            echo 'Host: GitHub ubuntu-24.04 x86-64 runner, QEMU TCG excluded'
            echo 'Scope: first-release gate only; master gate requires guarded cgroup memory and earlyoom.'
            echo 'A successful job certifies the first-release gate for this source revision.'
            echo 'Any failed or timed-out step leaves certification incomplete.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete first-release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zagscript-linux-first-release-${{ github.sha }}
          path: ${{ runner.temp }}/zagscript-linux-evidence/
          if-no-files-found: warn
          retention-days: 30

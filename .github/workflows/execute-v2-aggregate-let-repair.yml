name: Execute v2 aggregate let repair

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'agent/trigger-v2-aggregate-let-execution'
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2-aggregate-let-values
          fetch-depth: 0
          persist-credentials: true

      - name: Patch native aggregate-value lowering and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('zag-poc/selfhost/native/ncodegen.zag')
          text = source.read_text()
          old = '''                    if (rt_agg == 0) {
                        switch (initexpr.*) {
                            .call => |_c| { rt_agg = 1; }
                            .un   => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          new = '''                    if (rt_agg == 0) {
                        // A declared aggregate destination is copied from the address
                        // produced by aggregate-valued expressions. Coarse expression
                        // typing cannot always recover the concrete aggregate name, so
                        // admit only expression forms whose native lowering can produce
                        // an aggregate address. Scalar/literal forms remain rejected.
                        switch (initexpr.*) {
                            .id      => |_id| { rt_agg = 1; }
                            .fld     => |_f| { rt_agg = 1; }
                            .idx     => |_x| { rt_agg = 1; }
                            .call    => |_c| { rt_agg = 1; }
                            .switch_ => |_s| { rt_agg = 1; }
                            .un      => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one aggregate-let gate, found {text.count(old)}')
          source.write_text(text.replace(old, new, 1))

          tests_path = Path('zag-poc/tests/run_native.sh')
          tests = tests_path.read_text()
          anchor = '''nt  "struct byval return" 'struct P { x: i32, y: i32 } fn mk(a: i32, b: i32) P { return P{ .x = a, .y = b }; } fn main() i32 { let p: P = mk(30, 12); return p.x + p.y; }' 42
'''
          regression = anchor + '''nt  "aggregate let values" 'struct P { x: i32, y: i32 } struct H { first: P, second: P } enum Side { left, right } fn mk(a: i32, b: i32) P { return P{ .x = a, .y = b }; } fn copy(raw: P) P { let value: P = raw; return value; } fn field(raw: H) P { let value: P = raw.first; return value; } fn choose(side: Side) P { let value: P = switch (side) { .left => mk(10, 20), .right => mk(40, 2), }; return value; } fn main() i32 { let direct: P = mk(5, 7); let copied: P = copy(direct); let holder: H = H{ .first = mk(8, 9), .second = mk(1, 2) }; let selected: P = choose(Side.right); let from_field: P = field(holder); if (copied.x + copied.y != 12) { return 1; } if (from_field.x + from_field.y != 17) { return 2; } return selected.x + selected.y; }' 42
'''
          if regression not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit(f'expected one native regression anchor, found {tests.count(anchor)}')
              tests_path.write_text(tests.replace(anchor, regression, 1))

          Path('.github/workflows/diagnose-v2-aggregate-let.yml').unlink(missing_ok=True)
          Path('.github/aggregate-let-experiment-failure.log').unlink(missing_ok=True)
          PY

      - name: Bootstrap to byte-identical fixed point
        shell: bash
        run: |
          set -euo pipefail
          chmod +x zag-poc/znc zag-poc/bootstrap.sh \
            zag-poc/tests/check_native_bootstrap_repro.sh \
            zag-poc/tests/check_v2_list_named_owner.sh \
            zag-poc/tests/run_native.sh
          cd zag-poc
          ZAG_BOOTSTRAP_MEMORY_GUARD=off ./bootstrap.sh
          bash tests/check_native_bootstrap_repro.sh

      - name: Run focused strict aggregate and ownership gates
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v2_aggregate_let_values.zag <<'ZAG'
          struct Pair { left: i64, right: i64 }
          struct Holder { first: Pair, second: Pair }
          enum Side { left, right }

          fn pair(left: i64, right: i64) Pair {
              return Pair{ .left = left, .right = right };
          }
          fn copy_pair(raw: Pair) Pair {
              let value: Pair = raw;
              return value;
          }
          fn copy_field(holder: Holder) Pair {
              let value: Pair = holder.first;
              return value;
          }
          fn choose(side: Side) Pair {
              let value: Pair = switch (side) {
                  .left => pair(11, 22),
                  .right => pair(33, 44),
              };
              return value;
          }
          fn main() i32 {
              let direct: Pair = pair(1, 2);
              let copied: Pair = copy_pair(direct);
              let holder: Holder = Holder{
                  .first = pair(5, 6),
                  .second = pair(7, 8),
              };
              let field_copy: Pair = copy_field(holder);
              let selected: Pair = choose(Side.right);
              if (copied.left != 1 || copied.right != 2) { return 1; }
              if (field_copy.left != 5 || field_copy.right != 6) { return 2; }
              if (selected.left != 33 || selected.right != 44) { return 3; }
              return 0;
          }
          ZAG
          cd zag-poc
          ./znc /tmp/v2_aggregate_let_values.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/v2_aggregate_let_values
          /tmp/v2_aggregate_let_values
          ZNC=./znc bash tests/check_v2_list_named_owner.sh

      - name: Run native backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          cd zag-poc
          bash tests/run_native.sh

      - name: Commit verified source, seed, and regression
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zag-compiler-bot"
          git config user.email "zag-compiler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no commit'; exit 1; }
          git commit -m "native: lower aggregate let values by address"
          git push origin HEAD:agent/v2-aggregate-let-values
          git rev-parse HEAD

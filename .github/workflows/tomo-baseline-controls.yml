name: Tomo baseline and development controls
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths: [.github/workflows/tomo-baseline-controls.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zag-poc
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test evaluator development controls
        run: |
          python3 --version
          python3 research/tomo-independent-genotype-dev-v1.py --self-check
      - name: Baseline parser fixture with existing seed, no patch
        run: |
          set -uo pipefail
          p=research/tomo-parser-package-2026-10-30
          fixture="$p/tomo_bitnot_negative.zag"
          expected="$p/tomo_bitnot_expected.txt"
          echo 'BASELINE ONLY: checked-in seed, not rebuilt, patch not applied'
          sha256sum ./znc "$fixture" "$expected"
          cat "$expected"
          set +e
          ./znc "$fixture" -o "$RUNNER_TEMP/bitnot-baseline" > "$RUNNER_TEMP/bitnot-baseline.log" 2>&1
          rc=$?
          set -e
          echo '--- EMITTED DIAGNOSTIC BEGIN ---'
          cat "$RUNNER_TEMP/bitnot-baseline.log"
          echo '--- EMITTED DIAGNOSTIC END ---'
          echo "COMPILER_EXIT_CODE=$rc"
          if [ -e "$RUNNER_TEMP/bitnot-baseline" ]; then echo ARTIFACT_PRESENT=yes; else echo ARTIFACT_PRESENT=no; fi
          sed '/^znc:/d' "$RUNNER_TEMP/bitnot-baseline.log" > "$RUNNER_TEMP/bitnot-baseline.normalized"
          echo '--- EXACT EXPECTATION DIFF (expected path differs from fixture path) ---'
          set +e
          diff -u "$expected" "$RUNNER_TEMP/bitnot-baseline.normalized"
          diff_rc=$?
          set -e
          echo "EXPECTED_DIFF_EXIT_CODE=$diff_rc"
          if [ "$rc" -eq 1 ] && [ ! -e "$RUNNER_TEMP/bitnot-baseline" ] && [ "$diff_rc" -eq 0 ]; then
            echo BASELINE_COMPARISON=PASS
          else
            echo BASELINE_COMPARISON=FAIL
          fi
          echo 'Baseline comparison only; no claim of patch validation.'

name: Tomo baseline and development controls
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths:
      - .github/workflows/tomo-baseline-controls.yml
      - zag-poc/research/tomo-parser-package-2026-10-30/tomo_bitnot_negative.zag
      - zag-poc/research/tomo-parser-package-2026-10-30/tomo_bitnot_seed_baseline.expected
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zag-poc
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Test evaluator development controls
        run: |
          python3 --version
          python3 research/tomo-independent-genotype-dev-v1.py --self-check
      - name: Baseline parser fixture with existing seed, no patch
        run: |
          set -uo pipefail
          set +e
          p=research/tomo-parser-package-2026-10-30
          fixture="$p/tomo_bitnot_negative.zag"
          expected="$p/tomo_bitnot_seed_baseline.expected"
          output="$RUNNER_TEMP/bitnot-baseline.log"
          artifact="$RUNNER_TEMP/bitnot-baseline"
          echo 'BASELINE ONLY: checked-in seed, not rebuilt, patch not applied'
          echo 'Normalization: empty prefix set; compare complete merged stdout and stderr byte-for-byte.'
          sha256sum ./znc "$fixture" "$expected"
          rm -f "$artifact"
          ./znc "$fixture" -o "$artifact" > "$output" 2>&1
          rc=$?
          echo '--- EMITTED DIAGNOSTIC BEGIN ---'
          cat "$output"
          echo '--- EMITTED DIAGNOSTIC END ---'
          echo "COMPILER_EXIT_CODE=$rc"
          if [ -e "$artifact" ]; then present=yes; else present=no; fi
          echo "ARTIFACT_PRESENT=$present"
          compare_diagnostic() { cmp -s "$1" "$2"; }
          grep -Fq 'znc: error in main (line 1): native: unknown identifier in expression: ~' "$output" || { echo 'Mutation target missing'; exit 1; }
          sed 's/znc: error in main (line 1): native: unknown identifier in expression: ~/znc: error in main (line 1): diagnostic deliberately changed/' "$output" > "$RUNNER_TEMP/mutated.log"
          grep -v '^znc: error in main (line 1): native: unknown identifier in expression: ~$' "$output" > "$RUNNER_TEMP/deleted.log"
          if compare_diagnostic "$expected" "$RUNNER_TEMP/mutated.log"; then echo MUTATION_GATE=FAIL; exit 1; else echo MUTATION_GATE=PASS; fi
          if compare_diagnostic "$expected" "$RUNNER_TEMP/deleted.log"; then echo DELETION_GATE=FAIL; exit 1; else echo DELETION_GATE=PASS; fi
          echo '--- EXACT BASELINE DIFF ---'
          diff -u "$expected" "$output"
          diff_rc=$?
          echo "EXPECTED_DIFF_EXIT_CODE=$diff_rc"
          if [ "$rc" -eq 1 ] && [ "$present" = no ] && [ "$diff_rc" -eq 0 ] && compare_diagnostic "$expected" "$output"; then
            echo BASELINE_COMPARISON=PASS
          else
            echo BASELINE_COMPARISON=FAIL
            exit 1
          fi
          echo 'Observed seed baseline only; no claim of parser patch validation.'

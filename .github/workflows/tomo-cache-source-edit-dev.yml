name: Tomo cache source edit development repro
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths:
      - .github/workflows/tomo-cache-source-edit-dev.yml
      - zag-poc/research/tomo-cache-source-edit-repro.sh
permissions:
  contents: read
jobs:
  cache-source-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run source-edit repro against checked-in seed
        shell: bash
        working-directory: zag-poc
        run: |
          set -uo pipefail
          echo 'DEVELOPMENT RUN: checked-in seed, not rebuilt; no broad cache correctness claim'
          mkdir -p "$RUNNER_TEMP/cache-repro"
          export TMPDIR="$RUNNER_TEMP/cache-repro"
          bash research/tomo-cache-source-edit-repro.sh
          rc=$?
          echo "REPRO_EXIT_CODE=$rc"
          find "$TMPDIR" -type f -name '*.log' -print -exec cat {} \;
          exit "$rc"
      - name: Preserve repro outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cache-source-edit-evidence
          path: ${{ runner.temp }}/cache-repro/
          if-no-files-found: warn

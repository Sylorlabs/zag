name: One-shot qualified import visibility repair

on:
  push:
    branches:
      - zag-v2-machine-control
    paths:
      - .github/workflows/repair-import-visibility.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: install one-shot import visibility repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the PR branch
        uses: actions/checkout@v4
        with:
          ref: zag-v2-machine-control
          fetch-depth: 0

      - name: Patch enum-backed public visibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("zag-poc/selfhost/parse.zag")
          text = path.read_text()

          old = '''fn has_any_pub(inner: ArrayList[*Node], module: []u8) i32 {
              let i: i32 = 0;
              while (i < len[*Node](inner)) {
                  let d: *Node = get[*Node](inner, i);
                  if (decl_is_from(d, module) == 1) {
                      switch (d.*) {
                          .fn_decl => |f| { if (f.is_pub == 1) { return 1; } }
                          .struct_ => |s| { if (s.is_pub == 1) { return 1; } }
                          // Enum/union provenance predates NodeOrigin fields. Driver
                          // private implementation declarations are functions/structs
                          // and remain origin-exact here.
                          else => { }
                      }
                  }
                  i = i + 1;
              }
              return 0;
          }
          '''

          new = '''fn has_any_pub(inner: ArrayList[*Node], module: []u8, origins: ArrayList[NodeOrigin]) i32 {
              let i: i32 = 0;
              while (i < len[*Node](inner)) {
                  let d: *Node = get[*Node](inner, i);
                  let owned: i32 = decl_is_from(d, module);
                  // Functions and structs carry their origin directly. Enums
                  // still use the compact side table, so consult it before
                  // deciding whether this module has opted into pub filtering.
                  if (owned == 0) {
                      let origin: NodeOrigin = node_origin_find(origins, d);
                      if (origin.module.len > 0 && @strEq(origin.module, module)) { owned = 1; }
                  }
                  if (owned == 1) {
                      switch (d.*) {
                          .fn_decl => |f| { if (f.is_pub == 1) { return 1; } }
                          .struct_ => |s| { if (s.is_pub == 1) { return 1; } }
                          .enum_ => |e| { if (e.is_pub == 1) { return 1; } }
                          else => { }
                      }
                  }
                  i = i + 1;
              }
              return 0;
          }
          '''

          if text.count(old) != 1:
              raise SystemExit(f"expected one has_any_pub definition, found {text.count(old)}")
          text = text.replace(old, new)

          old_call = "    let do_filter: i32 = has_any_pub(inner, module);"
          new_call = "    let do_filter: i32 = has_any_pub(inner, module, origins.*);"
          if text.count(old_call) != 1:
              raise SystemExit(f"expected one has_any_pub call, found {text.count(old_call)}")
          text = text.replace(old_call, new_call)

          path.write_text(text)
          PY

      - name: Build the patched compiler and run semantic conformance
        shell: bash
        working-directory: zag-poc
        run: |
          chmod +x znc tests/run_semantics.sh
          ./znc selfhost/native/znc.zag -o /tmp/znc-import-visibility \
            --no-analyze --no-zagd --no-foreground-cache
          ZNC=/tmp/znc-import-visibility bash tests/run_semantics.sh

      - name: Commit the verified repair and remove this workflow
        shell: bash
        run: |
          rm .github/workflows/repair-import-visibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zag-poc/selfhost/parse.zag .github/workflows/repair-import-visibility.yml
          git commit -m "fix(parse): enforce privacy when pub enums activate filtering"
          git push origin HEAD:zag-v2-machine-control

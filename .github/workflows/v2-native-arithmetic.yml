name: Zag v2 Linux x86-64 arithmetic regressions

# Run on native Linux so edition-2027 arithmetic traps are executed by the
# target kernel. This is a focused regression job, not full v2 qualification.
on:
  workflow_dispatch:
    inputs:
      run_zopt_proof:
        description: 'Also check scoped ZIR and AArch64 peephole proofs with Z3'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - 'codex/v2-*'
    paths:
      - '.github/workflows/v2-native-arithmetic.yml'
      - 'zag-poc/selfhost/native/**'
      - 'zag-poc/tests/run_v2_*'
      - 'zag-poc/tests/run_zopt_*'
      - 'zag-poc/tests/zopt_*'
      - 'zag-poc/tests/run_aopt_*'
      - 'zag-poc/tests/aopt_*'
      - 'zag-poc/tests/pow2_remainder_qfbv.smt2'
      - 'zag-poc/tests/run_pow2_remainder_proof.sh'

permissions:
  contents: read

jobs:
  arithmetic:
    name: Native edition-2027 division, overflow, shift and narrowing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: zag-poc
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Require a physical x86-64 runner and a pinned ELF seed
        run: |
          set -euo pipefail
          test "$(uname -s):$(uname -m)" = Linux:x86_64
          if grep -q 'QEMU TCG' /proc/cpuinfo; then
            echo 'native v2 qualification refused on an emulated runner' >&2
            exit 1
          fi
          test -x znc
          file -b znc | grep -Eq '^ELF 64-bit.*x86-64.*statically linked'
          mkdir -p "$RUNNER_TEMP/v2-evidence"
          {
            echo "source=$GITHUB_SHA"
            uname -a
            sha256sum znc
          } > "$RUNNER_TEMP/v2-evidence/seed.txt"

      - name: Build compiler from this exact source revision
        run: |
          set -euo pipefail
          /usr/bin/time -f 'compiler elapsed=%E peak_rss_kib=%M' \
            ./znc selfhost/native/znc.zag --no-zagd --no-analyze \
            --no-foreground-cache -o "$RUNNER_TEMP/znc-current" \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/compiler.log"
          test -x "$RUNNER_TEMP/znc-current"
          file -b "$RUNNER_TEMP/znc-current" | grep -Eq '^ELF 64-bit.*x86-64.*statically linked'
          sha256sum "$RUNNER_TEMP/znc-current" \
            > "$RUNNER_TEMP/v2-evidence/compiler.sha256"

      - name: Verify native zero-divisor diagnostics and runtime traps
        run: |
          set -euo pipefail
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_v2_division_zero.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/division.log"

      - name: Verify native signed division overflow and v1 compatibility
        run: |
          set -euo pipefail
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_v2_signed_division_overflow.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/division-overflow.log"

      - name: Verify native shift-count behavior
        run: |
          set -euo pipefail
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_v2_shift_counts.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/shifts.log"

      - name: Verify native checked integer narrowing
        run: |
          set -euo pipefail
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_v2_checked_narrowing.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/narrowing.log"

      # Z3 is installed only for an explicitly requested proof run. The
      # experimental ZIR folders are not part of the v2 release gate.
      - name: Verify scoped optimizer proofs (opt-in)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_zopt_proof }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq z3
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_zopt_signed_divmod_proof.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/zopt-signed-divmod.log"
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_zopt_reflexive_cmpi_proof.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/zopt-reflexive-cmpi.log"
          bash tests/run_pow2_remainder_proof.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/pow2-remainder-proof.log"
          bash tests/run_aopt_adjacent_push_pop_proof.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/aopt-adjacent-push-pop.log"
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_zopt_region_scope_test.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/zopt-region-scope.log"
          ZNC="$RUNNER_TEMP/znc-current" bash tests/run_zopt_effect_contract_test.sh \
            2>&1 | tee "$RUNNER_TEMP/v2-evidence/zopt-effect-contract.log"

      - name: Record exact scope of evidence
        if: always()
        run: |
          {
            echo '### Zag v2 Linux x86-64 native arithmetic'
            echo "Source: \`$GITHUB_SHA\`"
            echo 'Compiler built from this source; edition-2027 tests cover division, signed overflow, shifts and narrowing.'
            if [ '${{ inputs.run_zopt_proof }}' = true ]; then
              echo 'Opt-in QF_BV proofs and native ZIR folder checks were requested; see job status and zopt proof logs.'
            fi
            echo 'This focused job does not prove a compiler fixed point or certify the full v2 release gate.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compiler identity and suite logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2-native-arithmetic-${{ github.sha }}
          path: ${{ runner.temp }}/v2-evidence/
          if-no-files-found: warn
          retention-days: 30

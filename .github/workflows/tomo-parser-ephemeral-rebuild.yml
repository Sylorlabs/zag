name: Tomo parser ephemeral rebuild
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths: [.github/workflows/tomo-parser-ephemeral-rebuild.yml]
permissions:
  contents: read
jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: zag-poc
    steps:
      - uses: actions/checkout@v4
      - name: Apply proposed diff in ephemeral checkout
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --short
          patch --batch --forward -p1 < research/tomo-parser-package-2026-10-30/tomo_unsupported_bitwise_not.diff
          git diff --check
          git diff -- selfhost/parse.zag
      - name: Rebuild fixed-point native compiler
        run: |
          set -euo pipefail
          ./bootstrap.sh
          sha256sum ./znc
          ./znc --version || true
      - name: Run parser regressions
        run: |
          set -uo pipefail
          package=research/tomo-parser-package-2026-10-30
          mkdir -p tests/diag /tmp/tomo-parser-evidence
          cp "$package/tomo_bitnot_negative.zag" tests/diag/tomo_bitnot_negative.zag
          rm -f /tmp/tomo-negative /tmp/tomo-positive /tmp/tomo-malformed
          ./znc tests/diag/tomo_bitnot_negative.zag -o /tmp/tomo-negative --no-zagd --no-foreground-cache > /tmp/tomo-parser-evidence/negative.txt 2>&1
          neg=$?
          cat /tmp/tomo-parser-evidence/negative.txt
          echo "NEGATIVE_EXIT=$neg"
          test -e /tmp/tomo-negative && echo NEGATIVE_ARTIFACT=yes || echo NEGATIVE_ARTIFACT=no
          ./znc "$package/tomo_bitwise_positive.zag" -o /tmp/tomo-positive --no-zagd --no-foreground-cache > /tmp/tomo-parser-evidence/positive.txt 2>&1
          pos=$?
          cat /tmp/tomo-parser-evidence/positive.txt
          echo "POSITIVE_COMPILE_EXIT=$pos"
          positive_run=255
          if [ "$pos" -eq 0 ] && [ -x /tmp/tomo-positive ]; then /tmp/tomo-positive; positive_run=$?; fi
          echo "POSITIVE_RUN_EXIT=$positive_run"
          ./znc "$package/tomo_malformed_token.zag" -o /tmp/tomo-malformed --no-zagd --no-foreground-cache > /tmp/tomo-parser-evidence/malformed.txt 2>&1
          malformed=$?
          cat /tmp/tomo-parser-evidence/malformed.txt
          echo "MALFORMED_EXIT=$malformed"
          test -e /tmp/tomo-malformed && echo MALFORMED_ARTIFACT=yes || echo MALFORMED_ARTIFACT=no
          # Exact proposed diagnostic block; preserve unfiltered complete output.
          python3 -c 'import pathlib,sys; p=pathlib.Path; actual=p("/tmp/tomo-parser-evidence/negative.txt").read_bytes(); expected=p("research/tomo-parser-package-2026-10-30/tomo_bitnot_expected.txt").read_bytes(); n=actual.count(expected); print("EXACT_EXPECTED_BLOCK_COUNT="+str(n)); sys.exit(n!=1)'
          exact=$?
          if [ "$neg" -eq 1 ] && [ ! -e /tmp/tomo-negative ] && [ "$exact" -eq 0 ] && [ "$pos" -eq 0 ] && [ "$positive_run" -eq 0 ] && [ "$malformed" -ne 0 ] && [ ! -e /tmp/tomo-malformed ]; then
            echo PARSER_REGRESSIONS=PASS
          else
            echo PARSER_REGRESSIONS=FAIL
            exit 1
          fi
      - name: Preserve complete compiler output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-ephemeral-evidence
          path: /tmp/tomo-parser-evidence/
          if-no-files-found: warn

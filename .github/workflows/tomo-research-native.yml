name: Tomo research native evidence
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths: [.github/workflows/tomo-research-native.yml]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: zag-poc
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap native compiler from pinned seed
        env:
          ZAG_BOOTSTRAP_MEMORY_GUARD: off
        run: |
          set -euo pipefail
          seed="$PWD/znc"
          sha256sum "$seed"
          seed_sha=$(sha256sum "$seed" | cut -d' ' -f1)
          manifest="$RUNNER_TEMP/zag-bootstrap.mod"
          printf 'name = "zag-ci-bootstrap"\nedition = "2026"\n[toolchain]\ncompiler = "sha256:%s"\n' "$seed_sha" > "$manifest"
          ZAG_BOOTSTRAP_SEED="$seed" ZAG_BOOTSTRAP_MANIFEST="$manifest" ./bootstrap.sh
          sha256sum ./znc
      - name: Execute research parser negative and compare proposed expected output
        run: |
          set -uo pipefail
          p=research/tomo-parser-package-2026-10-30
          fixture="$p/tomo_bitnot_negative.zag"
          expected="$p/tomo_bitnot_expected.txt"
          echo 'TIER: native execution; comparison is to source-derived, unqualified expectation'
          echo "FIXTURE=$fixture EXPECTED=$expected"
          cat "$expected"
          set +e
          ./znc "$fixture" -o "$RUNNER_TEMP/bitnot-native" > "$RUNNER_TEMP/bitnot.log" 2>&1
          rc=$?
          set -e
          echo '--- EMITTED DIAGNOSTIC BEGIN ---'
          cat "$RUNNER_TEMP/bitnot.log"
          echo '--- EMITTED DIAGNOSTIC END ---'
          echo "COMPILER_EXIT_CODE=$rc"
          if [ -e "$RUNNER_TEMP/bitnot-native" ]; then echo ARTIFACT_PRESENT=yes; else echo ARTIFACT_PRESENT=no; fi
          sed '/^znc:/d' "$RUNNER_TEMP/bitnot.log" > "$RUNNER_TEMP/bitnot.normalized"
          echo '--- EXPECTATION DIFF ---'
          diff -u "$expected" "$RUNNER_TEMP/bitnot.normalized" || mismatch=1
          if [ "$rc" -ne 1 ] || [ -e "$RUNNER_TEMP/bitnot-native" ] || [ "${mismatch:-0}" -ne 0 ]; then
            echo 'FAIL: actual result differs from proposed diagnostic contract'
            exit 1
          fi
          echo 'PASS: diagnostic matches proposed expectation; not an independently reproduced experiment'

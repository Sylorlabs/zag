name: macOS arm64 native qualification

on:
  workflow_dispatch:

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zag-poc
    steps:
      - uses: actions/checkout@v4

      - name: Verify pure-Zag source tree
        run: bash tests/check_pure_zag_tree.sh

      - name: Build current Linux compiler from seed
        run: |
          seed=seeds/linux-x86_64/znc
          test -x "$seed" || seed=./znc
          file -b "$seed" | grep -Eq '^ELF 64-bit.*x86-64.*statically linked'
          chmod +x "$seed"
          "$seed" selfhost/native/znc.zag --no-zagd --no-analyze --no-foreground-cache -o /tmp/znc-current

      - name: Verify Mach-O signing SHA-256
        run: |
          /tmp/znc-current selfhost/native/macho_arm64_test.zag --no-zagd -o /tmp/macho_arm64_test
          /tmp/macho_arm64_test

      - name: Cross-compile signed compiler for macOS arm64
        run: |
          /tmp/znc-current selfhost/native/znc.zag --target macos-arm64 --no-zagd --no-analyze --no-foreground-cache -o znc-macos-arm64
          file -b znc-macos-arm64 | grep -q 'Mach-O 64-bit executable arm64'

      - uses: actions/upload-artifact@v4
        with:
          name: zag-znc-macos-arm64-cross-${{ github.sha }}
          path: zag-poc/znc-macos-arm64
          if-no-files-found: error
          retention-days: 7

  native-qualification:
    needs: cross-build
    runs-on: macos-15-xlarge
    timeout-minutes: 120
    defaults:
      run:
        working-directory: zag-poc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zag-znc-macos-arm64-cross-${{ github.sha }}
          path: zag-poc

      - name: Qualify on GPU-capable Apple Silicon
        run: |
          test "$(uname -s):$(uname -m)" = Darwin:arm64
          chmod +x znc-macos-arm64
          verified_dir="$RUNNER_TEMP/zag-macos-arm64-verified"
          mkdir "$verified_dir"
          ZNC="$PWD/znc-macos-arm64" \
          ZAG_MACOS_VERIFIED_COMPILER_OUTPUT="$verified_dir/znc-macos-arm64" \
            bash tests/run_macos_arm64_release.sh
          (
            cd "$verified_dir"
            shasum -a 256 znc-macos-arm64 | tee znc-macos-arm64.sha256
            printf '%s\n' "$GITHUB_SHA" >SOURCE_COMMIT
          )
          {
            printf '### Native-qualified macOS compiler\n\n'
            printf 'Source commit: `%s`\n\n' "$GITHUB_SHA"
            printf 'SHA-256: `%s`\n' "$(awk '{ print $1 }' "$verified_dir/znc-macos-arm64.sha256")"
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build the locked editor client
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package
          first=$(shasum -a 256 zag-lang.vsix | awk '{ print $1 }')
          npm run package
          test "$first" = "$(shasum -a 256 zag-lang.vsix | awk '{ print $1 }')"

      - name: Validate the actual native archive and installation
        run: |
          verified_dir="$RUNNER_TEMP/zag-macos-arm64-verified"
          "$verified_dir/znc-macos-arm64" selfhost/zagd_macos_daemon.zag \
            --target macos-arm64 --no-zagd --no-analyze --no-foreground-cache \
            -o "$verified_dir/zagd-macos-arm64"
          ZNC="$verified_dir/znc-macos-arm64" \
          ZAGD="$verified_dir/zagd-macos-arm64" \
          ZAG_VSIX="$GITHUB_WORKSPACE/editors/vscode/zag-lang.vsix" \
            bash tests/run_release_package_roundtrip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zag-znc-macos-arm64-verified-${{ github.sha }}
          path: |
            ${{ runner.temp }}/zag-macos-arm64-verified/znc-macos-arm64
            ${{ runner.temp }}/zag-macos-arm64-verified/znc-macos-arm64.sha256
            ${{ runner.temp }}/zag-macos-arm64-verified/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 30

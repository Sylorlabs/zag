name: ZagScript completion host preflight

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/unsigned-integer-semantics
      - 'codex/**'
    paths:
      - .github/workflows/zagscript-host-preflight.yml
      - zag-poc/tests/run_zagscript_1_0_completion.sh
      - zag-poc/tests/run_zagscript_1_0_completion_host.sh
  pull_request:
    branches:
      - main
      - fix/unsigned-integer-semantics
    paths:
      - .github/workflows/zagscript-host-preflight.yml
      - zag-poc/tests/run_zagscript_1_0_completion.sh
      - zag-poc/tests/run_zagscript_1_0_completion_host.sh

permissions:
  contents: read

jobs:
  completion-host-preflight:
    name: Host selection and bootstrap guard regression
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: zag-poc
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n tests/run_zagscript_1_0_completion.sh
          bash -n tests/run_zagscript_1_0_completion_host.sh
      - name: Validate host-specific compiler selection and memory guards
        run: bash tests/run_zagscript_1_0_completion_host.sh

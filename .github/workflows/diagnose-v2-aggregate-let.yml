name: Diagnose native aggregate let lowering

on:
  push:
    branches: [agent/v2-aggregate-let-values]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show aggregate-let lowering context
        shell: bash
        run: |
          set -euo pipefail
          file=zag-poc/selfhost/native/ncodegen.zag
          line=$(grep -n "aggregate let needs an aggregate initializer" "$file" | head -n1 | cut -d: -f1)
          echo "aggregate-let diagnostic line=$line"
          start=$((line - 100))
          end=$((line + 50))
          sed -n "${start},${end}p" "$file"

      - name: Show switch-expression and aggregate helpers
        shell: bash
        run: |
          set -euo pipefail
          file=zag-poc/selfhost/native/ncodegen.zag
          echo '--- cg_lower_expr declaration ---'
          grep -n "fn cg_lower_expr" "$file" | head -n5 || true
          echo '--- aggregate expression-related cases ---'
          grep -n -E "switch_expr|switch.*expression|cg_type_is_agg|\.switch" "$file" | tail -n80 || true

      - name: Reproduce aggregate values in strict native mode
        shell: bash
        run: |
          set -euo pipefail
          cd zag-poc
          chmod +x ./znc
          cat > /tmp/aggregate-let-values.zag <<'ZAG'
          struct Pair {
              left: i64,
              right: i64,
          }

          enum Side { left, right }

          fn pair(left: i64, right: i64) Pair {
              return Pair{ .left = left, .right = right };
          }

          fn choose(side: Side) Pair {
              let value: Pair = switch (side) {
                  .left => pair(11, 22),
                  .right => pair(33, 44),
              };
              return value;
          }

          fn copy_pair(raw: Pair) Pair {
              let value: Pair = raw;
              return value;
          }

          fn main() i32 {
              let direct: Pair = pair(1, 2);
              let copied: Pair = copy_pair(direct);
              let selected: Pair = choose(Side.right);
              if (copied.left != 1 || copied.right != 2) { return 1; }
              if (selected.left != 33 || selected.right != 44) { return 2; }
              return 0;
          }
          ZAG
          set +e
          ./znc /tmp/aggregate-let-values.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/aggregate-let-values > /tmp/aggregate-let-values.log 2>&1
          status=$?
          set -e
          cat /tmp/aggregate-let-values.log
          echo "compile_status=$status"
          exit 0

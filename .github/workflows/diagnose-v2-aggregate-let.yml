name: Implement native aggregate let lowering

on:
  push:
    branches: [agent/v2-aggregate-let-values]
  pull_request:
    branches: [agent/v2-list-free-named-owner]

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/v2-aggregate-let-values
          fetch-depth: 0
          persist-credentials: true

      - name: Patch, self-host, verify, and commit
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          path = Path('zag-poc/selfhost/native/ncodegen.zag')
          text = path.read_text()
          old = '''                    if (rt_agg == 0) {
                        switch (initexpr.*) {
                            .call => |_c| { rt_agg = 1; }
                            .un   => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          new = '''                    if (rt_agg == 0) {
                        // The destination type is already a proven aggregate. These
                        // expression forms lower aggregate values as addresses even when
                        // coarse expression typing cannot recover the exact aggregate name.
                        switch (initexpr.*) {
                            .id      => |_id| { rt_agg = 1; }
                            .fld     => |_f| { rt_agg = 1; }
                            .idx     => |_x| { rt_agg = 1; }
                            .call    => |_c| { rt_agg = 1; }
                            .switch_ => |_s| { rt_agg = 1; }
                            .un      => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one aggregate gate, found {text.count(old)}')
          path.write_text(text.replace(old, new))

          test = Path('zag-poc/tests/v2_aggregate_let_values.zag')
          test.write_text('''struct Pair {
              left: i64,
              right: i64,
          }

          enum Side { left, right }

          fn pair(left: i64, right: i64) Pair {
              return Pair{ .left = left, .right = right };
          }

          fn copy_pair(raw: Pair) Pair {
              let value: Pair = raw;
              return value;
          }

          fn choose(side: Side) Pair {
              let value: Pair = switch (side) {
                  .left => pair(11, 22),
                  .right => pair(33, 44),
              };
              return value;
          }

          fn main() i32 {
              let direct: Pair = pair(1, 2);
              let copied: Pair = copy_pair(direct);
              let selected: Pair = choose(Side.right);
              if (copied.left != 1 || copied.right != 2) { return 1; }
              if (selected.left != 33 || selected.right != 44) { return 2; }
              return 0;
          }
          ''')

          script = Path('zag-poc/tests/check_v2_aggregate_let_values.sh')
          script.write_text('''#!/usr/bin/env bash
          set -euo pipefail
          cd "$(dirname "$0")/.."
          ZNC=${ZNC:-./znc}
          tmp=$(mktemp -d "${TMPDIR:-/tmp}/zag-v2-aggregate-let.XXXXXX")
          trap 'rm -rf "$tmp"' EXIT HUP INT TERM
          "$ZNC" tests/v2_aggregate_let_values.zag \\
              --no-zagd --analyze-strict --no-foreground-cache \\
              -o "$tmp/v2-aggregate-let-values"
          "$tmp/v2-aggregate-let-values"
          echo "v2 aggregate let values: passed"
          ''')
          PY
          chmod +x zag-poc/tests/check_v2_aggregate_let_values.sh

          set +e
          (
            cd zag-poc
            chmod +x ./znc ./bootstrap.sh
            ZAG_BOOTSTRAP_MEMORY_GUARD=off ./bootstrap.sh
            ZNC=./znc bash tests/check_v2_aggregate_let_values.sh
            ZNC=./znc bash tests/check_v2_list_named_owner.sh
          ) > /tmp/aggregate-let-implementation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -ne 0 ]; then
            git restore zag-poc/selfhost/native/ncodegen.zag zag-poc/znc zag-poc/zagd 2>/dev/null || true
            rm -f zag-poc/tests/v2_aggregate_let_values.zag \
                  zag-poc/tests/check_v2_aggregate_let_values.sh
            tail -n 240 /tmp/aggregate-let-implementation.log > .github/aggregate-let-experiment-failure.log
            rm -f .github/workflows/diagnose-v2-aggregate-let.yml
            git add -A
            git commit -m "ci: record aggregate let experiment failure"
            git push origin HEAD:agent/v2-aggregate-let-values
            cat .github/aggregate-let-experiment-failure.log
            exit "$status"
          fi

          cat /tmp/aggregate-let-implementation.log
          rm -f .github/workflows/diagnose-v2-aggregate-let.yml
          git add -A
          git commit -m "native: lower aggregate let values by address"
          git push origin HEAD:agent/v2-aggregate-let-values

name: Tomo public binding control self-test
on:
  workflow_dispatch:
  push:
    branches: [research/2026-10-30-tomo-zag-diagnostics]
    paths:
      - .github/workflows/tomo-binding-controls-dev.yml
      - zag-poc/research/tomo-binding-controls-dev-v2.py
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Public in-process toy only (not protected)
        run: |
          set -euo pipefail
          python3 --version
          sha256sum zag-poc/research/tomo-binding-controls-dev-v2.py
          python3 zag-poc/research/tomo-binding-controls-dev-v2.py

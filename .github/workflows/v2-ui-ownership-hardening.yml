name: Zag v2 UI ownership hardening

on:
  push:
    branches:
      - agent/v2-ui-ownership-hardening
    paths:
      - .github/run-v2-ui-ownership-hardening

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v6
        with:
          ref: agent/v2-ui-ownership-hardening
          fetch-depth: 0
          persist-credentials: true

      - name: Apply ownership checker patch
        run: python3 .github/patch_v2_ui_ownership.py

      - name: Bootstrap to native fixed point
        working-directory: zag-poc
        run: |
          set -euo pipefail
          chmod +x znc bootstrap.sh tests/check_native_bootstrap_repro.sh
          ZAG_BOOTSTRAP_MEMORY_GUARD=off ./bootstrap.sh
          bash tests/check_native_bootstrap_repro.sh

      - name: Validate UI ownership regressions
        working-directory: zag-poc
        run: |
          set -euo pipefail
          chmod +x tests/check_v2_ui_nonretaining.sh tests/check_v2_list_named_owner.sh tests/run_semantics.sh tests/run_native.sh
          ZNC=./znc bash tests/check_v2_ui_nonretaining.sh
          ZNC=./znc bash tests/check_v2_list_named_owner.sh
          bash tests/run_semantics.sh
          bash tests/run_native.sh

      - name: Commit verified compiler
        run: |
          set -euo pipefail
          rm -f .github/run-v2-ui-ownership-hardening .github/patch_v2_ui_ownership.py .github/workflows/v2-ui-ownership-hardening.yml
          git config user.name "zag-compiler-bot"
          git config user.email "zag-compiler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "hardening produced no commit"; exit 1; }
          git commit -m "v2: harden non-retaining UI call ownership"
          git push origin HEAD:agent/v2-ui-ownership-hardening
          git rev-parse HEAD

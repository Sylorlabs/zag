name: Zag CI

on:
  push:
    branches: [ main, native-self-hosting-no-zig ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    name: v1 native backend
    runs-on: ubuntu-24.04      # pinned for reproducibility — not ubuntu-latest

    defaults:
      run:
        working-directory: zag-poc

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache the native seed keyed on its SHA256. Bootstrap is always executed;
      # the cache only avoids artifact transfer work.
      - name: Compute seed SHA256
        id: seed-sha
        run: |
          sha256sum znc | cut -d' ' -f1 > /tmp/seed_hash
          echo "hash=$(cat /tmp/seed_hash)" >> "$GITHUB_OUTPUT"

      - name: Cache seed binaries
        uses: actions/cache@v4
        id: seed-cache
        with:
          path: |
            zag-poc/znc
          key: seed-${{ runner.os }}-${{ steps.seed-sha.outputs.hash }}

      - name: Make scripts executable
        run: |
          chmod +x znc bootstrap.sh run_tests.sh \
            tests/run_native.sh tests/run_selfhost.sh tests/run_native_authority.sh \
            tests/run_optimize.sh tests/run_stdlib.sh tests/run_selfhost_features.sh \
            tests/check_native_bootstrap_repro.sh tests/run_semantics.sh tests/run_diag.sh \
            tests/run_tooling.sh tests/run_programs.sh tests/test_lsp.sh \
            release.sh 2>/dev/null || true

      # ── Bootstrap ─────────────────────────────────────────────────────────
      - name: Bootstrap (rebuild znc from seed)
        run: ./bootstrap.sh

      # ── Fixpoint check ────────────────────────────────────────────────────
      - name: Fixpoint check (three native generations, byte-identical)
        run: bash tests/check_native_bootstrap_repro.sh

      # ── Authoritative v1 release gate ────────────────────────────────────
      # Poisons cc/gcc/clang/as/ld in PATH, then rebuilds znc + smoke-tests.
      # This is the only gate that must be green for a release.
      - name: Native authority gate (v1 release gate)
        run: bash tests/run_native_authority.sh

      # ── Native backend test suite ─────────────────────────────────────────
      - name: Native semantic conformance
        run: bash tests/run_semantics.sh

      - name: Structured diagnostic regressions
        run: bash tests/run_diag.sh

      - name: Formatter, package, DWARF, and LSP tooling
        run: bash tests/run_tooling.sh

      - name: Real-program acceptance suite
        run: bash tests/run_programs.sh

      - name: Native backend suite
        run: bash tests/run_native.sh

      # ── Additional suites (informational) ────────────────────────────────
      - name: Selfhost pipeline tests (informational)
        run: bash tests/run_selfhost.sh
        continue-on-error: true

      - name: Differential suite via zagc (informational, not a release gate)
        run: bash run_tests.sh
        continue-on-error: true

      # ── Preserve the verified native compiler ─────────────────────────────
      - name: Upload verified native compiler
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zag-znc-${{ github.sha }}
          path: zag-poc/znc
          if-no-files-found: ignore
          retention-days: 7

  aggregate-let-repair:
    name: v2 aggregate let fixed point
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/trigger-v2-aggregate-let-execution'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/v2-aggregate-let-values
          fetch-depth: 0
          persist-credentials: true

      - name: Apply aggregate-value lowering patch and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('zag-poc/selfhost/native/ncodegen.zag')
          text = source.read_text()
          old = '''                    if (rt_agg == 0) {
                        switch (initexpr.*) {
                            .call => |_c| { rt_agg = 1; }
                            .un   => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          new = '''                    if (rt_agg == 0) {
                        // A declared aggregate destination is copied from the address
                        // produced by aggregate-valued expressions. Coarse expression
                        // typing cannot always recover the concrete aggregate name, so
                        // admit only forms whose native lowering can produce an address.
                        switch (initexpr.*) {
                            .id      => |_id| { rt_agg = 1; }
                            .fld     => |_f| { rt_agg = 1; }
                            .idx     => |_x| { rt_agg = 1; }
                            .call    => |_c| { rt_agg = 1; }
                            .switch_ => |_s| { rt_agg = 1; }
                            .un      => |u| { if (@strEq(u.op, "try")) { rt_agg = 1; } }
                            else => { }
                        }
                    }
'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one aggregate-let gate, found {text.count(old)}')
              source.write_text(text.replace(old, new, 1))

          tests_path = Path('zag-poc/tests/run_native.sh')
          tests = tests_path.read_text()
          anchor = '''nt  "struct byval return" 'struct P { x: i32, y: i32 } fn mk(a: i32, b: i32) P { return P{ .x = a, .y = b }; } fn main() i32 { let p: P = mk(30, 12); return p.x + p.y; }' 42
'''
          regression = '''nt  "aggregate let values" 'struct P { x: i32, y: i32 } struct H { first: P, second: P } enum Side { left, right } fn mk(a: i32, b: i32) P { return P{ .x = a, .y = b }; } fn copy(raw: P) P { let value: P = raw; return value; } fn field(raw: H) P { let value: P = raw.first; return value; } fn choose(side: Side) P { let value: P = switch (side) { .left => mk(10, 20), .right => mk(40, 2), }; return value; } fn main() i32 { let direct: P = mk(5, 7); let copied: P = copy(direct); let holder: H = H{ .first = mk(8, 9), .second = mk(1, 2) }; let selected: P = choose(Side.right); let from_field: P = field(holder); if (copied.x + copied.y != 12) { return 1; } if (from_field.x + from_field.y != 17) { return 2; } return selected.x + selected.y; }' 42
'''
          if regression not in tests:
              if tests.count(anchor) != 1:
                  raise SystemExit(f'expected one native regression anchor, found {tests.count(anchor)}')
              tests_path.write_text(tests.replace(anchor, anchor + regression, 1))

          for extra in [
              '.github/workflows/diagnose-v2-aggregate-let.yml',
              '.github/aggregate-let-experiment-failure.log',
              '.github/v2-aggregate-let-failure.log',
          ]:
              Path(extra).unlink(missing_ok=True)
          PY

      - name: Bootstrap to byte-identical fixed point
        shell: bash
        run: |
          set -euo pipefail
          chmod +x zag-poc/znc zag-poc/bootstrap.sh \
            zag-poc/tests/check_native_bootstrap_repro.sh \
            zag-poc/tests/check_v2_list_named_owner.sh \
            zag-poc/tests/run_native.sh zag-poc/tests/run_semantics.sh
          cd zag-poc
          ZAG_BOOTSTRAP_MEMORY_GUARD=off ./bootstrap.sh
          bash tests/check_native_bootstrap_repro.sh

      - name: Run focused aggregate-value regression
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/v2_aggregate_let_values.zag <<'ZAG'
          struct Pair { left: i64, right: i64 }
          struct Holder { first: Pair, second: Pair }
          enum Side { left, right }
          fn pair(left: i64, right: i64) Pair { return Pair{ .left = left, .right = right }; }
          fn copy_pair(raw: Pair) Pair { let value: Pair = raw; return value; }
          fn copy_field(holder: Holder) Pair { let value: Pair = holder.first; return value; }
          fn choose(side: Side) Pair {
              let value: Pair = switch (side) {
                  .left => pair(11, 22),
                  .right => pair(33, 44),
              };
              return value;
          }
          fn main() i32 {
              let direct: Pair = pair(1, 2);
              let copied: Pair = copy_pair(direct);
              let holder: Holder = Holder{ .first = pair(5, 6), .second = pair(7, 8) };
              let field_copy: Pair = copy_field(holder);
              let selected: Pair = choose(Side.right);
              if (copied.left != 1 || copied.right != 2) { return 1; }
              if (field_copy.left != 5 || field_copy.right != 6) { return 2; }
              if (selected.left != 33 || selected.right != 44) { return 3; }
              return 0;
          }
          ZAG
          cd zag-poc
          ./znc /tmp/v2_aggregate_let_values.zag \
            --no-zagd --analyze-strict --no-foreground-cache \
            -o /tmp/v2_aggregate_let_values
          /tmp/v2_aggregate_let_values

      - name: Run ownership and native regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd zag-poc
          ZNC=./znc bash tests/check_v2_list_named_owner.sh
          bash tests/run_semantics.sh
          bash tests/run_native.sh

      - name: Commit verified compiler repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "zag-compiler-bot"
          git config user.email "zag-compiler-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'repair produced no commit'; exit 1; }
          git commit -m "native: lower aggregate let values by address"
          git push origin HEAD:agent/v2-aggregate-let-values
          git rev-parse HEAD

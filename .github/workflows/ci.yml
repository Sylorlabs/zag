name: Zag CI

on:
  workflow_dispatch:
  push:
    branches: [ main, native-self-hosting-no-zig ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: v1 native backend
    runs-on: ubuntu-24.04      # pinned for reproducibility — not ubuntu-latest

    defaults:
      run:
        working-directory: zag-poc

    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cache the native seed keyed on its SHA256. Bootstrap is always executed;
      # the cache only avoids artifact transfer work.
      - name: Compute seed SHA256
        id: seed-sha
        run: |
          sha256sum znc | cut -d' ' -f1 > /tmp/seed_hash
          echo "hash=$(cat /tmp/seed_hash)" >> "$GITHUB_OUTPUT"

      - name: Cache seed binaries
        uses: actions/cache@v4
        id: seed-cache
        with:
          path: |
            zag-poc/znc
          key: seed-${{ runner.os }}-${{ steps.seed-sha.outputs.hash }}

      - name: Make scripts executable
        run: |
          chmod +x znc bootstrap.sh \
            tests/run_native.sh tests/run_native_authority.sh \
            tests/check_native_bootstrap_repro.sh tests/run_semantics.sh tests/run_diag.sh \
            tests/check_pure_zag_tree.sh \
            tests/run_tooling.sh tests/run_programs.sh tests/test_lsp.sh \
            tests/run_native_arm64.sh tests/run_differential.sh tests/run_arm64_selfhost.sh \
            release.sh 2>/dev/null || true

      # ── Bootstrap ─────────────────────────────────────────────────────────
      - name: Reject retired C, Python, and Zig sources
        run: bash tests/check_pure_zag_tree.sh

      - name: Bootstrap (rebuild znc from seed)
        run: ./bootstrap.sh

      # ── Fixpoint check ────────────────────────────────────────────────────
      - name: Fixpoint check (three native generations, byte-identical)
        run: bash tests/check_native_bootstrap_repro.sh

      # ── Authoritative v1 release gate ────────────────────────────────────
      # Poisons cc/gcc/clang/as/ld in PATH, then rebuilds znc + smoke-tests.
      # This is the only gate that must be green for a release.
      - name: Native authority gate (v1 release gate)
        run: bash tests/run_native_authority.sh

      # ── Native backend test suite ─────────────────────────────────────────
      - name: Native semantic conformance
        run: bash tests/run_semantics.sh

      - name: Structured diagnostic regressions
        run: bash tests/run_diag.sh

      - name: Formatter, package, DWARF, and LSP tooling
        run: bash tests/run_tooling.sh

      - name: Real-program acceptance suite
        run: bash tests/run_programs.sh

      - name: Native backend suite
        run: bash tests/run_native.sh

      # ── arm64 backend (emulated) ─────────────────────────────────────────
      - name: Install qemu-user-static
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static

      - name: arm64 backend suite (qemu-user)
        run: bash tests/run_native_arm64.sh

      - name: x86-64 vs arm64 differential suite
        run: bash tests/run_differential.sh

      - name: arm64 self-hosting fixpoint (qemu-user)
        run: bash tests/run_arm64_selfhost.sh

      # ── Cross-compile the arm64 compiler for the native-hardware job ──────
      - name: Cross-compile znc → arm64
        run: ./znc selfhost/native/znc.zag --target arm64 -o znc-arm64

      - name: Upload arm64 compiler
        uses: actions/upload-artifact@v4
        with:
          name: zag-znc-arm64-${{ github.sha }}
          path: zag-poc/znc-arm64
          retention-days: 7

      # ── Preserve the verified native compiler ─────────────────────────────
      - name: Upload verified native compiler
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zag-znc-${{ github.sha }}
          path: zag-poc/znc
          if-no-files-found: ignore
          retention-days: 7

  # Independent so macOS backend feedback and its downloadable compiler do not
  # wait behind the longer Linux, qemu, and fixpoint suites.
  macos-cross:
    name: macOS arm64 cross-target
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: zag-poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify pure-Zag source tree
        run: bash tests/check_pure_zag_tree.sh

      - name: Build current Linux compiler from seed
        run: |
          chmod +x znc
          ./znc selfhost/native/znc.zag --no-zagd -o /tmp/znc-current

      - name: Verify Mach-O signing SHA-256
        run: |
          /tmp/znc-current selfhost/native/macho_arm64_test.zag --no-zagd -o /tmp/macho_arm64_test
          /tmp/macho_arm64_test

      - name: Cross-compile signed compiler for macOS arm64
        run: |
          /tmp/znc-current selfhost/native/znc.zag --target macos-arm64 --no-zagd -o znc-macos-arm64
          file znc-macos-arm64 | grep -q 'Mach-O 64-bit arm64 executable'

      - name: Upload macOS arm64 compiler
        uses: actions/upload-artifact@v4
        with:
          name: zag-znc-macos-arm64-${{ github.sha }}
          path: zag-poc/znc-macos-arm64
          retention-days: 7

  # Cross-compilation checks the Mach-O layout, but only native Apple Silicon
  # exercises the Darwin loader, raw syscall ABI, embedded ad-hoc signature,
  # and the macOS self-hosting fixpoint.  Keep this independent from Linux so
  # Darwin feedback is not delayed by the qemu suites.
  test-macos-arm64-native:
    name: macOS arm64 native release gate
    runs-on: macos-14
    defaults:
      run:
        working-directory: zag-poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64

      - name: Verify pure-Zag source tree
        run: bash tests/check_pure_zag_tree.sh

      - name: Native macOS arm64 release gate
        run: |
          chmod +x znc tests/run_macos_arm64_release.sh
          bash tests/run_macos_arm64_release.sh

  # Real ARM silicon — no qemu. Catches what user-mode emulation structurally
  # cannot: the kernel's actual ELF loader (page-size congruence of PT_LOAD
  # segments), real syscall behaviour, and eventually memory-ordering and
  # icache-coherence bugs once threads/hot-patch land on arm64.
  test-arm64-native:
    name: v1 arm64 backend (native hardware)
    needs: test
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: zag-poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download arm64 compiler
        uses: actions/download-artifact@v4
        with:
          name: zag-znc-arm64-${{ github.sha }}
          path: zag-poc

      - name: Make compiler executable
        run: chmod +x znc-arm64

      - name: arm64 backend suite (native)
        run: ZNC=$PWD/znc-arm64 bash tests/run_native_arm64.sh

      - name: arm64 self-hosting fixpoint (native)
        run: ZNC=$PWD/znc-arm64 bash tests/run_arm64_selfhost.sh
